name: LinguaDrill

options:
  bundleIdPrefix: com.slizik
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  LinguaDrill:
    type: application
    platform: iOS
    sources:
      - path: LinguaDrill
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slizik.linguadrill
        INFOPLIST_FILE: LinguaDrill/Info.plist
        CODE_SIGN_ENTITLEMENTS: LinguaDrill/LinguaDrill.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: LinguaDrillExtension
      - sdk: WidgetKit.framework

  LinguaDrillExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: LinguaDrillExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slizik.linguadrill.widget
        INFOPLIST_FILE: LinguaDrillExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: LinguaDrillExtension/LinguaDrillExtension.entitlements
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  LinguaDrill:
    build:
      targets:
        LinguaDrill: all
    run:
      config: Debug
    archive:
      config: Release

  LinguaDrillExtension:
    build:
      targets:
        LinguaDrillExtension: all
        LinguaDrill: all
    run:
      config: Debug
      executable: LinguaDrill
    archive:
      config: Release
