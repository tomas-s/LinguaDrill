name: FlashWidget

options:
  bundleIdPrefix: com.slizik
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  FlashWidget:
    type: application
    platform: iOS
    sources:
      - path: FlashWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slizik.flashwidget
        INFOPLIST_FILE: FlashWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: FlashWidget/FlashWidget.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: FlashWidgetExtension
      - sdk: WidgetKit.framework

  FlashWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: FlashWidgetExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slizik.flashwidget.widget
        INFOPLIST_FILE: FlashWidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: FlashWidgetExtension/FlashWidgetExtension.entitlements
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
